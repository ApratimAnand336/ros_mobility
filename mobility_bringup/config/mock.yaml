# Mock domain: motor model only, no simulator. use_sim_time false.
wheel_controller:
  ros__parameters:
    auto_arm: true

mock_adapter:
  ros__parameters:
    update_rate: 200.0
    substeps: 5
    effort_timeout: 0.25
    vel_noise_std: 0.0          # rad/s, try 0.2 to mimic encoder noise
    pos_noise_std: 0.0          # rad
    encoder_counts: 0           # counts/wheel rev for quantisation, 0 = off
    drive_motor: {v_bus: 24.0, gear_ratio: 50.0, kt: 0.03, ke: 0.03, resistance: 0.5, max_torque: 150.0}
    steer_motor: {v_bus: 24.0, gear_ratio: 100.0, kt: 0.03, ke: 0.03, resistance: 0.5, max_torque: 150.0}
    drive_plant: {inertia: 0.3, viscous: 0.5, coulomb: 2.0}
    steer_plant: {inertia: 0.05, viscous: 2.0, coulomb: 3.0}
